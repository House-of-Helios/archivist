name: Archivist
options:
  bundleIdPrefix: com.houseofhelios
  deploymentTarget:
    macOS: "14.0"
packages:
  ArchivistCore:
    path: ArchivistCore
targets:
  Archivist:
    type: application
    platform: macOS
    sources:
      - path: Archivist
        excludes:
          - Resources/Fonts/**
          - Resources/LaunchAgents/**
      - path: Archivist/Resources/Fonts
        type: folder
    dependencies:
      - package: ArchivistCore
        product: ArchivistCore
    postBuildScripts:
      # The scheduler's launchd agent lives inside the app (SMAppService.agent finds it here).
      - name: Bundle scheduler agent
        basedOnDependencyAnalysis: false
        script: |
          DEST="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Library/LaunchAgents"
          mkdir -p "$DEST"
          cp "$SRCROOT/Archivist/Resources/LaunchAgents/com.houseofhelios.archivist.scheduler.plist" "$DEST/"
      # One steady signature (tools/sign.sh), so macOS remembers permission answers across builds.
      - name: Sign
        basedOnDependencyAnalysis: false
        script: |
          "$SRCROOT/tools/sign.sh" "$TARGET_BUILD_DIR/$WRAPPER_NAME"
    info:
      path: Archivist/Info.plist
      properties:
        # The version lives here: xcodegen rewrites Info.plist from this block.
        CFBundleShortVersionString: "0.0.20"
        CFBundleVersion: "20"
        CFBundleDisplayName: Archivist
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "House of Helios, GPL-3.0"
        NSRemovableVolumesUsageDescription: "Archivist copies files to and from this drive."
        NSNetworkVolumesUsageDescription: "Archivist copies files to and from this shared drive."
        NSDesktopFolderUsageDescription: "Archivist backs up the folders you choose."
        NSDocumentsFolderUsageDescription: "Archivist backs up the folders you choose."
        NSDownloadsFolderUsageDescription: "Archivist backs up the folders you choose."
        NSSystemAdministrationUsageDescription: "Full Disk Access lets Archivist back up a whole drive."
        ATSApplicationFontsPath: Fonts
        LSApplicationCategoryType: public.app-category.utilities
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.houseofhelios.archivist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_VERSION: "5.9"
        CODE_SIGNING_ALLOWED: NO    # tools/sign.sh signs instead, with one steady identity
